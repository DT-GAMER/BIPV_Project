<script>
const map = L.map('map').setView([55.94242326, -3.2138790800000003], 19);

  maxZoom: 22,

const data = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "Selected building footprint", "source": "overture-maps", "overture_id": "51760847-5793-4486-aaf9-76db99c95025", "osm_id": null}, "geometry": {"type": "Polygon", "coordinates": [[[-3.2142503, 55.9423978], [-3.214531, 55.9422687], [-3.2142352, 55.9420582], [-3.2131811, 55.9424119], [-3.2133229, 55.9425092], [-3.2133243, 55.9425101], [-3.213598, 55.9426979], [-3.2139902, 55.9425175], [-3.2141075, 55.9424635], [-3.2142503, 55.9423978]]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 0", "length_m": 22.61898165094926, "bearing_deg": 230.6056002048769}, "geometry": {"type": "LineString", "coordinates": [[-3.2142503, 55.9423978], [-3.214531, 55.9422687]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 1", "length_m": 29.785423921367947, "bearing_deg": 141.79827145016662}, "geometry": {"type": "LineString", "coordinates": [[-3.214531, 55.9422687], [-3.2142352, 55.9420582]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 2", "length_m": 76.52196736576154, "bearing_deg": 59.07118827381515}, "geometry": {"type": "LineString", "coordinates": [[-3.2142352, 55.9420582], [-3.2131811, 55.9424119]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 3", "length_m": 13.965273241674678, "bearing_deg": 320.78039258232087}, "geometry": {"type": "LineString", "coordinates": [[-3.2131811, 55.9424119], [-3.2133229, 55.9425092]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 5", "length_m": 26.954908781594547, "bearing_deg": 320.7795288594552}, "geometry": {"type": "LineString", "coordinates": [[-3.2133243, 55.9425101], [-3.213598, 55.9426979]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 6", "length_m": 31.60491013933721, "bearing_deg": 230.6025280889089}, "geometry": {"type": "LineString", "coordinates": [[-3.213598, 55.9426979], [-3.2139902, 55.9425175]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 7", "length_m": 9.455698271176752, "bearing_deg": 230.57876259502757}, "geometry": {"type": "LineString", "coordinates": [[-3.2139902, 55.9425175], [-3.2141075, 55.9424635]]}}, {"type": "Feature", "properties": {"name": "Footprint edge 8", "length_m": 11.508532928336802, "bearing_deg": 230.59555061473858}, "geometry": {"type": "LineString", "coordinates": [[-3.2141075, 55.9424635], [-3.2142503, 55.9423978]]}}, {"type": "Feature", "properties": {"name": "Selected facade edge", "length_m": 31.60491013933721, "bearing_deg": 230.6025280889089, "facade_width_source": "overture-maps-image-width-matched-edge"}, "geometry": {"type": "LineString", "coordinates": [[-3.213598, 55.9426979], [-3.2139902, 55.9425175]]}}, {"type": "Feature", "properties": {"name": "Selected footprint centroid", "distance_to_query_m": 45.510554960794046}, "geometry": {"type": "Point", "coordinates": [-3.2138790800000003, 55.94242326]}}, {"type": "Feature", "properties": {"name": "Input address/coordinate point"}, "geometry": {"type": "Point", "coordinates": [-3.2139748, 55.9420175]}}]};
function style(feature) {
  const name = feature.properties && feature.properties.name || '';
  if (name === 'Selected building footprint') {
    return {color: '#1f77b4', weight: 2, fillColor: '#1f77b4', fillOpacity: 0.18};
  }
  if (name === 'Selected facade edge') {
    return {color: '#e31a1c', weight: 6};
  }
  if (name.startsWith('Footprint edge')) {
    return {color: '#888', weight: 1, dashArray: '4 4'};
  }
  return {color: '#333', weight: 2};
}
function pointToLayer(feature, latlng) {
  const name = feature.properties && feature.properties.name || '';
  const color = name === 'Input address/coordinate point' ? '#ff7f00' : '#33a02c';
  return L.circleMarker(latlng, {radius: 7, color, fillColor: color, fillOpacity: 0.9});
}
const layer = L.geoJSON(data, {
  style,
  pointToLayer,
  onEachFeature: (feature, layer) => {
    const props = feature.properties || {};
    layer.bindPopup(Object.entries(props).map(([k,v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
  }
}).addTo(map);
map.fitBounds(layer.getBounds(), {padding: [30, 30]});
</script>
